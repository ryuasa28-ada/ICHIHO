<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>株式会社ICHIHO | 静岡発・EC販売／リユース／EC販売支援</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
/* =========================================================
   Page-level theme variables (driven by Tweaks)
   ========================================================= */
:root {
  --accent: var(--sunrise);
  --accent-ink: var(--sunrise-ink);
}
html { scroll-behavior: smooth; scroll-padding-top: 64px; }
body { overflow-x: hidden; }

/* Tighten section top padding so anchor-landings sit clean under the
   sticky header (small top, generous bottom for scroll rhythm). */
.section { padding-block: var(--s-6) var(--s-9); }
@media (max-width: 768px) { .section { padding-block: var(--s-5) var(--s-7); } }

/* common helpers */
.anchor--mute { color: var(--mute); }

/* =========================================================
   Header
   ========================================================= */
.site-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(244, 246, 249, 0.82);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.site-header__inner {
  height: var(--header-h);
  display: flex; align-items: center; justify-content: space-between;
  gap: 24px;
}
/* 2段組みワードマーク（上:英字bold / 下:正式社名）— テキストのみ */
.site-header__logo {
  display: inline-flex; align-items: center;
  white-space: nowrap;
}
.site-header__logo-txt { display: flex; flex-direction: column; gap: 3px; line-height: 1; }
.site-header__logo-mark {
  font-family: var(--font-en); font-size: 20px; font-weight: 700;
  letter-spacing: 0.16em;
}
.site-header__logo-name { font-size: 11px; font-weight: 400; letter-spacing: 0.02em; }
.site-header__nav { display: none; gap: 28px; align-items: center; }
.site-header__nav > a, .nav-dd__trigger {
  font-size: 14px; color: var(--ink-2); font-weight: 500;
  position: relative; padding: 4px 0;
  white-space: nowrap;
  transition: color var(--dur-micro) var(--ease);
  background: none; border: 0; cursor: pointer; font-family: var(--font-jp);
  display: inline-flex; align-items: center; gap: 5px;
}
.site-header__nav > a::after, .nav-dd__trigger::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -22px;
  height: 2px; background: var(--accent); transform: scaleX(0);
  transform-origin: left center;
  transition: transform var(--dur-state) var(--ease);
}
.site-header__nav > a:hover, .nav-dd__trigger:hover { color: var(--ink); }
.site-header__nav > a:hover::after, .nav-dd:hover .nav-dd__trigger::after, .nav-dd.is-open .nav-dd__trigger::after { transform: scaleX(1); }

/* 事業内容 dropdown */
.nav-dd { position: relative; }
.nav-dd__chev { transition: transform var(--dur-state) var(--ease); }
.nav-dd:hover .nav-dd__chev, .nav-dd.is-open .nav-dd__chev { transform: rotate(180deg); }
.nav-dd__menu {
  position: absolute; top: calc(100% + 14px); left: 50%; transform: translateX(-50%) translateY(8px);
  min-width: 280px;
  background: var(--cloud); border: 1px solid var(--line); border-radius: var(--r-3);
  box-shadow: var(--shadow-3); padding: 8px;
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity var(--dur-state) var(--ease), transform var(--dur-state) var(--ease), visibility var(--dur-state);
  z-index: 60;
}
.nav-dd:hover .nav-dd__menu, .nav-dd.is-open .nav-dd__menu {
  opacity: 1; visibility: visible; pointer-events: auto; transform: translateX(-50%) translateY(0);
}
.nav-dd--right .nav-dd__menu { left: auto; right: 0; transform: translateX(0) translateY(8px); }
.nav-dd--right.is-open .nav-dd__menu, .nav-dd--right:hover .nav-dd__menu { transform: translateX(0) translateY(0); }
.nav-dd__menu::before { content: ""; position: absolute; top: -16px; left: 0; right: 0; height: 16px; }
.nav-dd__item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-2); transition: background var(--dur-micro) var(--ease); }
.nav-dd__item:hover { background: var(--paper-2); }
.nav-dd__dot { width: 8px; height: 8px; border-radius: var(--r-full); flex-shrink: 0; }
.nav-dd__dot--ec { background: var(--sunrise); }
.nav-dd__dot--reuse { background: var(--indigo); }
.nav-dd__dot--support { background: var(--tea); }
.nav-dd__txt { display: flex; flex-direction: column; gap: 2px; }
.nav-dd__txt-jp { font-size: 14px; font-weight: 500; color: var(--ink); }
.nav-dd__txt-en { font-family: var(--font-en); font-size: 11px; letter-spacing: 0.14em; color: var(--mute); text-transform: uppercase; }
.nav-dd__sep { height: 1px; background: var(--line); margin: 6px 8px; }
.nav-dd__top { display: block; padding: 10px 14px; border-radius: var(--r-2); font-size: 13px; color: var(--mute); font-weight: 500; }
.nav-dd__top:hover { background: var(--paper-2); color: var(--ink-2); }
.nav-dd__top::after { display: none; }
.site-header__cta { display: none; gap: 8px; }
.site-header__burger {
  display: flex; flex-direction: column; gap: 5px; padding: 8px;
}
.site-header__burger span { width: 18px; height: 1.5px; background: var(--ink); display: block; }
.site-header__drawer {
  display: none;
  flex-direction: column; gap: 0;
  padding: 8px 24px 20px;
  border-bottom: 1px solid var(--line);
  background: var(--paper);
}
.site-header__drawer.is-open { display: flex; }
.site-header__drawer a {
  padding: 14px 0; border-bottom: 1px solid var(--line);
  color: var(--ink); font-weight: 500;
}
.site-header__drawer .drawer-sub { padding-left: 16px; font-size: 14px; color: var(--ink-2); }
.site-header__drawer a.btn { margin-top: 12px; border-bottom: 0; align-self: flex-start; }
@media (min-width: 880px) {
  .site-header__nav { display: flex; }
  .site-header__cta { display: flex; }
  .site-header__burger { display: none; }
  .site-header__drawer { display: none !important; }
}

/* =========================================================
   Hero
   ========================================================= */
.hero {
  padding: 40px 0 96px;
  position: relative; overflow: hidden;
}
.hero__inner { position: relative; }
.hero__anchor-row {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 24px;
}
.hero__anchor-sep { width: 24px; height: 1px; background: var(--mute); display: inline-block; }
.hero__quote { color: var(--accent-ink); }
.hero__head {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(36px, 5vw, 60px);
  line-height: 1.25;
  letter-spacing: 0.005em;
  color: var(--ink);
  margin: 0 0 28px;
  text-wrap: pretty;
}
.hero__lead { color: var(--ink-2); max-width: 36em; margin: 0; }

/* =========================================================
   Section heads
   ========================================================= */
.section-head { margin-bottom: 56px; max-width: 720px; }
.section-head__row { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.section-head__num { font-family: var(--font-en); font-size: 12px; color: var(--mute); letter-spacing: 0.16em; font-weight: 500; }
.section-head__jp { margin: 0 0 24px; font-weight: 500; }
.section-head__sub { margin: 0 0 24px; color: var(--ink-2); }
.section-head .hairline { margin: 0; }

/* =========================================================
   Philosophy
   ========================================================= */
.section--philosophy { background: var(--paper-2); position: relative; }
.philosophy__body {
  display: grid; grid-template-columns: 1fr; gap: 48px;
}
.philosophy__pull-wrap { display: flex; flex-direction: column; gap: 32px; }
.philosophy__pull {
  font-family: var(--font-serif);
  font-size: clamp(28px, 3.4vw, 40px);
  font-weight: 400;
  line-height: 1.5;
  color: var(--ink);
  margin: 0;
  letter-spacing: 0.005em;
}
.philosophy__quote { color: var(--accent-ink); }
.philosophy__rule {
  display: flex; align-items: center; gap: 16px;
}
.philosophy__rule-line { flex: 1; height: 1px; background: var(--line); display: block; }
.philosophy__text {
  display: flex; flex-direction: column; gap: 20px;
  color: var(--ink-2); font-size: 16px; line-height: 1.95;
}
.philosophy__text p { margin: 0; }
.philosophy__text strong { color: var(--ink); font-weight: 500; }
@media (min-width: 880px) {
  .philosophy__body { grid-template-columns: 1fr 1fr; gap: 80px; }
}

/* =========================================================
   Business
   ========================================================= */
.business__grid {
  display: grid; grid-template-columns: 1fr; gap: 28px;
}
.business__card {
  background: var(--cloud);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 40px 32px 32px;
  display: flex; flex-direction: column; gap: 24px;
  position: relative; overflow: hidden;
  color: inherit; text-decoration: none;
  transition: box-shadow var(--dur-state) var(--ease), transform var(--dur-state) var(--ease);
}
.business__card:hover { box-shadow: var(--shadow-2); transform: translateY(-2px); }
.business__more { display: inline-flex; align-items: center; }
.business__title { margin: 0; }
.business__body { color: var(--ink-2); margin: 0; }
.business__title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.business__logo { height: 52px; width: auto; flex-shrink: 0; }
@media (min-width: 880px) {
  .business__grid { grid-template-columns: 1fr 1fr; gap: 32px; }
  .business__grid--three { grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .business__card { padding: 36px 28px 28px; }
}

/* =========================================================
   ecoサイクル — reuse intake flow
   ========================================================= */
.section--eco { background: var(--ink); color: var(--paper); position: relative; overflow: hidden; }
.section--eco::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(160deg, rgba(107, 155, 209, 0.16) 0%, rgba(107, 155, 209, 0) 62%);
  pointer-events: none;
}
.section--eco .container { position: relative; z-index: 1; }
.section--eco .anchor { color: var(--sky); }
.eco__top {
  display: grid; grid-template-columns: 1fr; gap: 40px;
  margin-bottom: 56px;
  padding-bottom: 48px;
  border-bottom: 1px solid rgba(244,246,249,0.14);
  align-items: start;
}
.eco__head-row { display: flex; align-items: center; gap: 20px; }
.eco__logo {
  height: 84px; width: auto; flex-shrink: 0;
  background: var(--paper);
  border-radius: var(--r-full);
  padding: 8px;
}
.eco__head { margin: 16px 0 20px; color: var(--paper); font-weight: 500; }
.eco__lead { color: rgba(244,246,249,0.78); margin: 0; max-width: 30em; }
.eco__cta { display: flex; flex-direction: column; gap: 14px; align-self: stretch; }
.eco__btn {
  display: flex; flex-direction: column; gap: 4px;
  padding: 18px 24px;
  border-radius: var(--r-2);
  transition: transform var(--dur-micro) var(--ease), box-shadow var(--dur-state) var(--ease), background var(--dur-micro) var(--ease);
  box-shadow: var(--shadow-2);
}
.eco__btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-3); }
.eco__btn:active { transform: translateY(0); box-shadow: none; }
.eco__btn-sub { font-size: 12px; letter-spacing: 0.04em; opacity: 0.85; }
.eco__btn-main { font-size: 20px; font-weight: 700; font-family: var(--font-en); letter-spacing: 0.01em; }
.eco__btn--line { background: var(--tea); color: var(--paper); }
.eco__btn--line:hover { background: #4d6b42; }
.eco__btn--line .eco__btn-main { font-family: var(--font-jp); }
.eco__btn--tel { background: var(--sky); color: var(--ink); }
.eco__btn--tel:hover { background: #7ba8d8; }
.eco__cta-note { color: rgba(244,246,249,0.55); text-align: center; }
.eco__steps {
  list-style: none; margin: 0; padding: 0;
  display: grid; grid-template-columns: 1fr; gap: 16px;
  counter-reset: eco;
}
.eco__step {
  background: rgba(244,246,249,0.05);
  border: 1px solid rgba(244,246,249,0.14);
  border-radius: var(--r-3);
  padding: 28px 28px 30px;
  display: flex; flex-direction: column; gap: 12px;
  position: relative;
}
.eco__step-no { color: var(--sky) !important; }
.eco__step-title { margin: 0; color: var(--paper); font-weight: 500; }
.eco__step-desc { margin: 0; color: rgba(244,246,249,0.74); }
@media (min-width: 760px) {
  .eco__top { grid-template-columns: 1.5fr 1fr; gap: 56px; }
  .eco__cta { flex-direction: column; }
}
@media (min-width: 880px) {
  .eco__steps { grid-template-columns: repeat(3, 1fr); gap: 20px; }
}

/* =========================================================
   Featured products
   ========================================================= */
.section--featured { background: var(--paper); }
.featured__head {
  display: flex; flex-direction: column; gap: 24px;
  align-items: flex-start;
  margin-bottom: 48px;
}
.featured__head .section-head { margin-bottom: 0; }
.featured__toggle {
  display: inline-flex;
  background: var(--cloud);
  border: 1px solid var(--line);
  border-radius: var(--r-full);
  padding: 4px;
  gap: 4px;
}
.featured__toggle-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 18px 8px 8px;
  border-radius: var(--r-full);
  color: var(--mute);
  font-family: var(--font-jp);
  font-weight: 500;
  transition: color var(--dur-micro) var(--ease), background var(--dur-micro) var(--ease);
}
.featured__toggle-btn:hover { color: var(--ink-2); }
.featured__toggle-btn .anchor { color: inherit; }
.featured__toggle-btn .featured__toggle-pill { opacity: 0.55; transition: opacity var(--dur-micro) var(--ease); }
.featured__toggle-btn.is-active { color: var(--ink); background: var(--paper-2); }
.featured__toggle-btn.is-active .featured__toggle-pill { opacity: 1; }

@media (min-width: 720px) {
  .featured__head { flex-direction: row; align-items: flex-end; justify-content: space-between; gap: 48px; }
}

.prod-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
}
@media (min-width: 720px) { .prod-grid { grid-template-columns: repeat(4, 1fr); } }

.prod {
  background: var(--cloud);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: box-shadow var(--dur-state) var(--ease), transform var(--dur-state) var(--ease);
  display: flex; flex-direction: column;
  opacity: 0;
  animation: prodIn 0.4s var(--ease) forwards;
}
@keyframes prodIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.prod:hover { box-shadow: var(--shadow-2); transform: translateY(-2px); }
.prod__media { position: relative; aspect-ratio: 4 / 5; }
.prod__svg { width: 100%; height: 100%; display: block; }
.prod__tags {
  position: absolute; top: 12px; left: 12px;
  display: flex; gap: 6px; flex-wrap: wrap;
}
.prod__meta { padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 8px; }
.prod__cat { color: var(--mute); letter-spacing: 0.04em; }
.prod__name {
  margin: 0; font-size: 14px; line-height: 1.5; font-weight: 500; color: var(--ink);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.prod__row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 4px; }
.prod__price { font-family: var(--font-en); font-weight: 600; font-size: 18px; letter-spacing: -0.01em; }
.prod__price.is-new   { color: var(--sunrise-ink); }
.prod__price.is-reuse { color: var(--indigo); }
.prod__channel { color: var(--mute); }

.featured__foot {
  margin-top: 40px;
  display: flex; flex-direction: column; gap: 16px;
  padding-top: 24px; border-top: 1px solid var(--line);
}
.featured__foot-note { color: var(--mute); margin: 0; }
.featured__channels { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.featured__channel-list { display: inline-flex; gap: 20px; flex-wrap: wrap; }
.featured__channel-list .num { color: var(--ink-2); font-weight: 500; font-size: 14px; }
@media (min-width: 720px) {
  .featured__foot { flex-direction: row; justify-content: space-between; align-items: center; }
}

/* =========================================================
   Company
   ========================================================= */
.section--company { background: var(--paper-2); }
.company__grid {
  display: grid; grid-template-columns: 1fr; gap: 48px;
  align-items: start;
}
.company__list {
  margin: 0;
  background: var(--cloud);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
}
.company__row {
  display: grid; grid-template-columns: 1fr; padding: 0;
  border-bottom: 1px solid var(--line);
}
.company__row:last-child { border-bottom: 0; }
.company__term {
  padding: 18px 24px 4px; color: var(--mute); font-size: 13px; font-weight: 500; margin: 0;
}
.company__def {
  padding: 0 24px 18px; color: var(--ink); font-size: 15px; margin: 0;
}
@media (min-width: 720px) {
  .company__row { grid-template-columns: 200px 1fr; }
  .company__term { padding: 20px 24px; }
  .company__def  { padding: 20px 24px; border-left: 1px solid var(--line); }
}
.company__aside {
  background: var(--cloud);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 32px;
  display: flex; flex-direction: column; gap: 16px;
}
.company__aside-head { margin: 4px 0 0; }
.company__aside-body { margin: 0; }
.company__map {
  border-radius: 12px; overflow: hidden;
  border: 1px solid var(--line);
  margin-top: 8px;
}
.company__map svg { display: block; width: 100%; height: auto; }
@media (min-width: 980px) {
  .company__grid { grid-template-columns: 1.4fr 1fr; gap: 32px; }
}

/* =========================================================
   Contact
   ========================================================= */
.section--contact { background: var(--paper); position: relative; }
.contact__grid {
  display: grid; grid-template-columns: 1fr; gap: 48px;
}
.contact__aside { display: flex; flex-direction: column; gap: 16px; }
.contact__aside-note { color: var(--mute); margin: 0; }
.contact__direct {
  display: flex; flex-direction: column; gap: 24px;
  margin-top: 28px; padding-top: 28px; border-top: 1px solid var(--line);
}
.contact__direct-item { display: flex; flex-direction: column; gap: 8px; }
.contact__direct-val {
  font-family: var(--font-en);
  font-size: 24px; font-weight: 500; color: var(--ink); letter-spacing: -0.005em;
}
.contact__direct-val--small { font-family: var(--font-jp); font-size: 15px; font-weight: 400; line-height: 1.7; }
.contact__direct-sub { color: var(--mute); }
.contact__form {
  display: flex; flex-direction: column; gap: 18px;
  background: var(--cloud);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 32px;
}
.contact__form-head {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 16px; border-bottom: 1px solid var(--line);
  margin-bottom: 4px;
}
.field { display: flex; flex-direction: column; }
.field-row { display: grid; grid-template-columns: 1fr; gap: 18px; }
@media (min-width: 720px) { .field-row { grid-template-columns: 1fr 1fr; } }

.contact__topic { display: flex; flex-wrap: wrap; gap: 8px; }
.contact__topic-opt {
  display: inline-flex; align-items: center;
  padding: 9px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-full);
  background: var(--paper);
  color: var(--ink-2);
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  transition: all var(--dur-micro) var(--ease);
}
.contact__topic-opt input { position: absolute; opacity: 0; pointer-events: none; }
.contact__topic-opt:hover { border-color: var(--ink-2); color: var(--ink); }
.contact__topic-opt.is-on {
  background: var(--ink); color: var(--paper); border-color: var(--ink);
}

.contact__submit { align-self: flex-start; margin-top: 8px; }
.contact__thanks { padding: 16px 4px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.contact__thanks-head { margin: 0; }
.contact__thanks-body { margin: 0; color: var(--ink-2); }
@media (min-width: 880px) {
  .contact__grid { grid-template-columns: 1fr 1.2fr; gap: 80px; }
}

/* =========================================================
   Footer
   ========================================================= */
.site-footer { background: var(--ink); color: var(--paper); padding: 80px 0 32px; }
.site-footer__inner {
  display: grid; grid-template-columns: 1fr; gap: 48px;
  padding-bottom: 48px; border-bottom: 1px solid rgba(229,224,214,0.12);
}
.site-footer__brand { display: flex; gap: 16px; align-items: flex-start; }
.site-footer__brand img { filter: brightness(0) invert(1); opacity: 0.85; }
.site-footer__name { font-size: 16px; font-weight: 500; color: var(--paper); margin-bottom: 6px; }
.site-footer .small, .site-footer .micro { color: rgba(244,246,249,0.55); }
.site-footer__tagline { margin-top: 8px; }
.site-footer__cols { display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px; }
.site-footer__col { display: flex; flex-direction: column; gap: 12px; }
.site-footer__col .anchor { color: var(--sky); margin-bottom: 4px; }
.site-footer__col a { color: rgba(244,246,249,0.85); font-size: 14px; transition: color var(--dur-micro) var(--ease); }
.site-footer__col a:hover { color: var(--paper); }
.site-footer__base {
  display: flex; flex-direction: column; gap: 8px;
  justify-content: space-between; padding-top: 24px;
}
@media (min-width: 720px) {
  .site-footer__base { flex-direction: row; align-items: center; }
}
@media (min-width: 880px) {
  .site-footer__inner { grid-template-columns: 1.3fr 1.4fr; gap: 64px; }
  .site-footer__cols { grid-template-columns: repeat(2, 1fr); gap: 48px; }
}

/* tags__new accent override (link to current accent if it matches new tone) */

/* =========================================================
   Mobile hardening (≤ 640px)
   ========================================================= */
@media (max-width: 640px) {
  /* Header — keep logo + burger comfortable */
  .site-header__inner { gap: 12px; }
  .site-header__logo-mark { font-size: 17px; letter-spacing: 0.14em; }
  .site-header__logo-name { font-size: 10px; }

  /* Hero */
  .hero__anchor-row { flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .hero__head { margin-bottom: 22px; }

  /* Section heads */
  .section-head { margin-bottom: 36px; }
  .section-head__sub { font-size: 16px; }

  /* Business cards */
  .business__card { padding: 28px 22px 24px; border-radius: 16px; }
  .business__title-row { gap: 10px; }
  .business__logo { height: 40px; }

  /* Company table — comfortable stacked rows */
  .company__term { padding: 16px 18px 2px; }
  .company__def { padding: 0 18px 16px; }
  .company__aside { padding: 24px; }

  /* Tap targets */
  .site-header__drawer a { padding: 15px 0; }
  .site-header__burger { padding: 10px; }
}

/* =========================================================
   ▼▼▼ Visual refresh — ブルー基調 / Noto Sans JP / 波型セクション区切り
   このブロックはトップページ (index.html) にのみ読み込まれる。
   下層ページが共有する colors_and_type.css は変更していないため、
   ここでのトークン上書きは本ページ限定で閉じている。
   ========================================================= */
:root {
  /* Key / sub color */
  --bd-blue:       #1A56B0;   /* キーカラー：紺寄りの濃いブルー */
  --bd-blue-deep:  #123C7E;
  --bd-blue-ink:   #0E2D5E;
  --bd-sky:        #7EC8E3;   /* サブカラー：淡いスカイブルー */
  --bd-tint:       #EAF3FB;   /* ブルー系セクション背景 */
  --bd-tint-2:     #DCEBF7;

  /* 既存トークンを本ページだけブルーへ寄せる */
  --indigo:        #1A56B0;
  --indigo-ink:    #123C7E;
  --sky:           #7EC8E3;

  --ease-out: cubic-bezier(.16, .84, .44, 1);
  --wave-h: 70px;
}

/* ---------------------------------------------------------
   1. Typography — 見出し・本文ともに Noto Sans JP
   --------------------------------------------------------- */
.h1, .h2, .h3, .display, .display-xl {
  font-family: var(--font-jp);
  font-weight: 700;
  letter-spacing: 0.01em;
}
.serif { font-family: var(--font-jp); font-weight: 700; letter-spacing: 0.02em; }
.body, .lead { font-weight: 400; }
strong { font-weight: 700; }

/* 章番号・英語ラベル：小さめ + 広い字間 + ブルーの差し色 */
.anchor { font-size: 12px; font-weight: 600; letter-spacing: 0.22em; color: var(--bd-blue); }
.anchor--mute { color: var(--mute); }

/* ---------------------------------------------------------
   2. Header
   --------------------------------------------------------- */
.site-header {
  background: rgba(255, 255, 255, 0.88);
  border-bottom: 1px solid rgba(26, 86, 176, 0.10);
}
.site-header__logo { color: var(--bd-blue-ink); }
.site-header__logo-mark, .site-header__logo-name { color: var(--bd-blue-ink); }
.site-header__nav > a, .nav-dd__trigger { font-weight: 500; }
.site-header__nav > a:hover, .nav-dd__trigger:hover { color: var(--bd-blue); }
.site-header__nav > a::after, .nav-dd__trigger::after { background: var(--bd-blue); }
.nav-dd__menu { border-radius: 16px; border-color: rgba(26, 86, 176, 0.12); box-shadow: 0 18px 44px rgba(14, 45, 94, 0.14); }
.nav-dd__item:hover { background: var(--bd-tint); }
.nav-dd__dot--ec { background: var(--bd-blue); }
.nav-dd__dot--reuse { background: var(--bd-sky); }
.nav-dd__dot--support { background: var(--bd-blue-ink); }
.nav-dd__top:hover { background: var(--bd-tint); color: var(--bd-blue); }
.site-header__burger span { background: var(--bd-blue-ink); }
.site-header__drawer a { border-bottom-color: rgba(26, 86, 176, 0.12); }

/* ---------------------------------------------------------
   3. Buttons / 丸いブルーの矢印ボタン
   --------------------------------------------------------- */
.btn {
  border-radius: var(--r-full);
  padding: 12px 16px 12px 24px;
  font-weight: 700;
  gap: 12px;
}
.btn--primary {
  background: var(--bd-blue); color: #fff;
  box-shadow: 0 8px 20px rgba(26, 86, 176, 0.22);
}
.btn--primary:hover {
  background: var(--bd-blue-deep); color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 14px 30px rgba(26, 86, 176, 0.30);
}
.btn--ghost {
  background: rgba(255, 255, 255, 0.72);
  color: var(--bd-blue); border-color: rgba(26, 86, 176, 0.40);
}
.btn--ghost:hover {
  background: var(--bd-blue); color: #fff; border-color: var(--bd-blue);
  transform: translateY(-2px);
  box-shadow: 0 14px 30px rgba(26, 86, 176, 0.24);
}
.btn:active { transform: translateY(0); }

.rnd-arrow {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; flex-shrink: 0;
  border-radius: var(--r-full);
  background: rgba(255, 255, 255, 0.20);
  transition: transform var(--dur-state) var(--ease-out), background var(--dur-state) var(--ease);
}
.rnd-arrow svg { width: 14px; height: 14px; }
.btn--ghost .rnd-arrow { background: rgba(26, 86, 176, 0.12); }
.btn:hover .rnd-arrow { transform: translateX(3px); }
.btn--ghost:hover .rnd-arrow { background: rgba(255, 255, 255, 0.22); }

/* ---------------------------------------------------------
   4. Hero — イラストをセクション全面の背景に敷き、その上にコピーを重ねる
   --------------------------------------------------------- */
.hero {
  padding: 96px 0 132px;
  min-height: min(88vh, 800px);
  display: flex; align-items: center;
  background: var(--bd-tint-2);
}
.hero__bg {
  position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background: linear-gradient(180deg, #F8FCFE 0%, #E4F0F9 58%, #D2E6F5 100%);
}
/* 幅は常に 100%、下端で揃える。空はうしろのグラデーションが受け持つ。 */
.hero__scene {
  position: absolute; left: 0; right: 0; bottom: 0;
  width: 100%; height: auto; display: block;
}
/* 可読性確保のオーバーレイ。コピーのある左側を強め、右の絵は透かす。 */
.hero__scrim {
  position: absolute; inset: 0;
  background:
    linear-gradient(96deg,
      rgba(255, 255, 255, 0.95) 0%,
      rgba(255, 255, 255, 0.88) 30%,
      rgba(240, 247, 252, 0.52) 56%,
      rgba(240, 247, 252, 0) 80%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.34) 0%, rgba(255, 255, 255, 0) 34%);
  /* コピーのある帯だけに効かせ、海の上では素直に消す。 */
  -webkit-mask-image: linear-gradient(180deg, #000 0 70%, rgba(0, 0, 0, 0.34) 86%, rgba(0, 0, 0, 0) 100%);
  mask-image: linear-gradient(180deg, #000 0 70%, rgba(0, 0, 0, 0.34) 86%, rgba(0, 0, 0, 0) 100%);
}
.hero__inner { z-index: 1; width: 100%; }
.hero__copy { max-width: 620px; }
.hero__anchor-sep { background: var(--bd-sky); width: 32px; height: 2px; }
.hero__head {
  font-family: var(--font-jp);
  font-weight: 700;
  font-size: clamp(30px, 4.6vw, 54px);
  line-height: 1.34;
  letter-spacing: 0.015em;
  color: var(--bd-blue-ink);
  margin: 0 0 26px;
}
.hero__head-line { display: block; }
.hero__quote { color: var(--bd-blue); }
.hero__lead {
  font-size: clamp(15px, 1.6vw, 18px);
  line-height: 2.1;
  color: var(--ink-2);
  max-width: 31em;
}

/* 右端の縦組みスクロール誘導 */
.hero__scroll {
  position: absolute; z-index: 2;
  right: clamp(16px, 2.6vw, 40px); bottom: 64px;
  display: none; flex-direction: column; align-items: center; gap: 14px;
  color: var(--bd-blue);
}
.hero__scroll:hover { color: var(--bd-blue-deep); }
.hero__scroll-txt {
  writing-mode: vertical-rl; text-orientation: mixed;
  font-family: var(--font-en); font-size: 11px; font-weight: 600;
  letter-spacing: 0.3em; text-transform: uppercase;
}
.hero__scroll-line {
  width: 1px; height: 76px; position: relative; overflow: hidden;
  background: linear-gradient(180deg, rgba(126, 200, 227, 0.9), rgba(126, 200, 227, 0));
}
.hero__scroll-line::after {
  content: ""; position: absolute; left: 0; top: 0;
  width: 1px; height: 26px; background: var(--bd-blue);
  animation: scrollCue 2.2s var(--ease) infinite;
}
@keyframes scrollCue {
  0%   { transform: translateY(-26px); opacity: 0; }
  25%  { opacity: 1; }
  100% { transform: translateY(76px);  opacity: 0; }
}
@media (min-width: 1024px) { .hero__scroll { display: flex; } }

/* ---------------------------------------------------------
   5. Section rhythm — 白 / ブルー系を交互配置し、波型で繋ぐ
   --------------------------------------------------------- */
.section { padding-block: 104px 112px; }
.section--philosophy { background: var(--cloud); }
.section--business   { background: var(--bd-tint); }
.section--company    { background: var(--cloud); }

.section--philosophy, .section--business, .section--company, .site-footer { position: relative; }
.section--philosophy > .container,
.section--business > .container,
.section--company > .container { position: relative; z-index: 1; }

.section--philosophy::before,
.section--business::before,
.section--company::before,
.site-footer::before {
  content: ""; position: absolute; z-index: 0; pointer-events: none;
  left: 0; right: 0; top: calc(var(--wave-h) * -1 + 1px); height: var(--wave-h);
  background-repeat: no-repeat; background-position: center bottom; background-size: 100% 100%;
}
.section--philosophy::before,
.section--company::before {
  background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1440 70' preserveAspectRatio='none'><path d='M0,70 L0,36 C240,2 470,66 720,42 C970,18 1200,58 1440,28 L1440,70 Z' fill='%23FFFFFF'/></svg>");
}
.section--business::before {
  background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1440 70' preserveAspectRatio='none'><path d='M0,70 L0,30 C260,62 480,6 730,26 C980,46 1210,66 1440,38 L1440,70 Z' fill='%23EAF3FB'/></svg>");
}
.site-footer::before {
  background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1440 70' preserveAspectRatio='none'><path d='M0,70 L0,34 C230,4 480,64 720,40 C960,16 1210,56 1440,26 L1440,70 Z' fill='%230E2D5E'/></svg>");
}

/* 淡いスカイブルーの背景装飾 */
.section--philosophy::after {
  content: ""; position: absolute; z-index: 0; pointer-events: none;
  right: -140px; top: 60px; width: 460px; height: 460px; border-radius: 50%;
  background: radial-gradient(circle at 32% 32%, rgba(126, 200, 227, 0.30), rgba(126, 200, 227, 0) 70%);
}

/* ---------------------------------------------------------
   6. Section head — 章番号(小) + ラベル + 見出し(大)
   --------------------------------------------------------- */
.section-head { margin-bottom: 52px; max-width: 780px; }
.section-head__row { gap: 12px; margin-bottom: 18px; }
.section-head__mark { width: 26px; height: 3px; border-radius: 2px; background: var(--bd-blue); display: inline-block; }
.section-head__num { color: var(--bd-blue); font-weight: 700; font-size: 12px; letter-spacing: 0.22em; }
.section-head__jp {
  font-size: clamp(27px, 3.8vw, 42px);
  font-weight: 700; line-height: 1.38; letter-spacing: 0.01em;
  color: var(--bd-blue-ink); margin-bottom: 20px;
}
.section-head__sub { font-size: clamp(15px, 1.5vw, 18px); color: var(--ink-2); }
.section-head .hairline {
  height: 2px;
  background: linear-gradient(90deg, var(--bd-blue) 0 64px, rgba(26, 86, 176, 0.14) 64px);
}

/* ---------------------------------------------------------
   7. Philosophy
   --------------------------------------------------------- */
.philosophy__pull {
  font-size: clamp(24px, 3.1vw, 38px);
  font-weight: 700; line-height: 1.62; color: var(--bd-blue-ink);
}
.philosophy__quote { color: var(--bd-blue); }
.philosophy__rule-line { height: 2px; background: linear-gradient(90deg, var(--bd-sky), rgba(126, 200, 227, 0.12)); }
.philosophy__text { font-size: 16px; line-height: 2.05; }
.philosophy__text strong { color: var(--bd-blue); font-weight: 700; }

/* ---------------------------------------------------------
   8. Business — タイトル → 説明文 → 矢印ボタンの簡素なカード
   --------------------------------------------------------- */
.business__card {
  background: var(--cloud);
  border: 1px solid rgba(26, 86, 176, 0.10);
  border-radius: 22px;
  padding: 34px 30px 28px;
  gap: 18px;
  box-shadow: 0 10px 30px rgba(14, 45, 94, 0.07);
  transition: transform var(--dur-state) var(--ease-out),
              box-shadow var(--dur-state) var(--ease-out),
              border-color var(--dur-state) var(--ease);
}
.business__card:hover {
  transform: translateY(-6px);
  box-shadow: 0 24px 50px rgba(14, 45, 94, 0.14);
  border-color: rgba(26, 86, 176, 0.26);
}
.business__title { font-size: clamp(20px, 2.1vw, 25px); font-weight: 700; color: var(--bd-blue-ink); }
.business__body { font-size: 15px; line-height: 1.95; }
/* 説明文を伸ばして矢印を下端に固定し、3枚の高さを揃える。 */
.business__more { margin-top: auto; align-self: flex-start; }
.business__more .rnd-arrow { width: 44px; height: 44px; background: var(--bd-blue); color: #fff; }
.business__more .rnd-arrow svg { width: 17px; height: 17px; }
.business__card:hover .business__more .rnd-arrow { background: var(--bd-blue-deep); transform: translateX(4px); }

/* ---------------------------------------------------------
   9. Company
   --------------------------------------------------------- */
.company__list, .company__aside {
  border-radius: 20px;
  border-color: rgba(26, 86, 176, 0.10);
  box-shadow: 0 10px 30px rgba(14, 45, 94, 0.06);
}
.company__row { border-bottom-color: rgba(26, 86, 176, 0.10); transition: background var(--dur-micro) var(--ease); }
.company__row:hover { background: var(--bd-tint); }
.company__term { color: var(--bd-blue); font-weight: 700; }
.company__aside { background: linear-gradient(158deg, #FFFFFF 0%, var(--bd-tint) 100%); }
.company__aside-head { font-weight: 700; color: var(--bd-blue-ink); }
.company__map { border-radius: 14px; border-color: rgba(26, 86, 176, 0.12); }
@media (min-width: 720px) {
  .company__def { border-left-color: rgba(26, 86, 176, 0.10); }
}

/* ---------------------------------------------------------
   10. Footer
   --------------------------------------------------------- */
.site-footer { background: var(--bd-blue-ink); padding: 116px 0 32px; }
.site-footer__inner { border-bottom-color: rgba(255, 255, 255, 0.16); }
.site-footer__col .anchor { color: var(--bd-sky); }
.site-footer__col a:hover { color: var(--bd-sky); }

/* ---------------------------------------------------------
   11. スクロール連動アニメーション（控えめに）
   --------------------------------------------------------- */
[data-reveal] {
  opacity: 0;
  transform: translateY(26px);
  transition: opacity 720ms var(--ease-out), transform 720ms var(--ease-out);
  transition-delay: var(--reveal-delay, 0ms);
}
[data-reveal].is-in { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  [data-reveal] { opacity: 1 !important; transform: none !important; transition: none !important; }
  .hero__scroll-line::after { animation: none; }
  .btn:hover, .business__card:hover { transform: none; }
}

/* ---------------------------------------------------------
   12. Responsive
   --------------------------------------------------------- */
@media (max-width: 879px) {
  .hero { padding: 84px 0 116px; min-height: min(80vh, 680px); }
  .hero__copy { max-width: none; }
}
@media (max-width: 768px) {
  :root { --wave-h: 44px; }
  .section { padding-block: 68px 76px; }
  .site-footer { padding-top: 80px; }
  .section-head { margin-bottom: 38px; }
  .section--philosophy::after { display: none; }
}
/* 縦長画面では絵を上下に、コピーは白のベールの上に置く。 */
@media (max-width: 720px) {
  .hero__scrim {
    background:
      linear-gradient(180deg,
        rgba(255, 255, 255, 0.94) 0%,
        rgba(255, 255, 255, 0.86) 46%,
        rgba(240, 247, 252, 0.52) 74%,
        rgba(240, 247, 252, 0.10) 100%);
    -webkit-mask-image: none;
    mask-image: none;
  }
}
@media (max-width: 640px) {
  .hero { padding: 64px 0 88px; min-height: min(74vh, 560px); }
  .hero__head { line-height: 1.42; margin-bottom: 22px; }
  .hero__lead { line-height: 1.95; }
  .business__card { padding: 28px 22px 24px; border-radius: 18px; gap: 16px; }
}
</style>
</head>
<body>

<div id="root" data-screen-label="Marketing Homepage"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="site.jsx"></script>
<script type="text/babel" src="site-featured.jsx"></script>
<script type="text/babel" src="site-tail.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useLayoutEffect, useRef } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "indigo"
}/*EDITMODE-END*/;

const ACCENTS = {
  indigo:  { color: "var(--indigo)",     ink: "var(--indigo-ink)", swatch: "#1A56B0" },
  navy:    { color: "var(--bd-blue-ink)", ink: "var(--bd-blue-ink)", swatch: "#0E2D5E" },
  sky:     { color: "var(--bd-sky)",     ink: "var(--bd-blue)",    swatch: "#7EC8E3" },
};

/* スクロールで画面内に入った要素をフェード + 下からスライドインさせる。
   兄弟要素どうしだけを少しずつ遅らせ、セクションごとに遅延はリセットする。 */
const REVEAL_SELECTOR = [
  ".hero__anchor-row", ".hero__head", ".hero__lead",
  ".section-head",
  ".philosophy__pull-wrap", ".philosophy__text",
  ".business__card",
  ".company__list", ".company__aside",
  ".site-footer__brand", ".site-footer__cols",
].join(", ");

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Apply accent to :root.
  useEffect(() => {
    const a = ACCENTS[t.accent] || ACCENTS.indigo;
    document.documentElement.style.setProperty("--accent", a.color);
    document.documentElement.style.setProperty("--accent-ink", a.ink);
  }, [t.accent]);

  // smooth scroll w/ sticky-header offset (handled via scroll-padding in CSS,
  // we just need to scroll to the element)
  const jump = (id) => {
    if (id === "top") { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    const el = document.getElementById(id);
    if (el) {
      const y = el.getBoundingClientRect().top + window.scrollY - 64;
      window.scrollTo({ top: y, behavior: "smooth" });
    }
  };

  // Scroll-reveal. useLayoutEffect so the initial hidden state is set before
  // the first paint (otherwise elements flash in, then animate).
  useLayoutEffect(() => {
    const els = Array.from(document.querySelectorAll(REVEAL_SELECTOR));
    const perParent = new Map();
    els.forEach((el) => {
      const n = perParent.get(el.parentElement) || 0;
      perParent.set(el.parentElement, n + 1);
      el.style.setProperty("--reveal-delay", `${Math.min(n, 5) * 90}ms`);
      el.setAttribute("data-reveal", "");
    });
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (!e.isIntersecting) return;
        e.target.classList.add("is-in");
        io.unobserve(e.target);
      });
    }, { rootMargin: "0px 0px -10% 0px", threshold: 0.06 });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, [t.accent]);

  // Intercept hero CTA buttons that use data-jump
  useEffect(() => {
    const handler = (e) => {
      const a = e.target.closest("[data-jump]");
      if (!a) return;
      e.preventDefault();
      jump(a.getAttribute("data-jump"));
    };
    document.addEventListener("click", handler);
    return () => document.removeEventListener("click", handler);
  }, []);

  return (
    <>
      <Header onJump={jump} />
      <main>
        <Hero />
        <PhilosophySection />
        <BusinessSection />
        <CompanySection />
      </main>
      <Footer />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Accent color" />
        <TweakColor
          label="Accent"
          value={ACCENTS[t.accent].swatch}
          options={Object.values(ACCENTS).map(a => a.swatch)}
          onChange={(swatch) => {
            const key = Object.keys(ACCENTS).find(k => ACCENTS[k].swatch === swatch) || "indigo";
            setTweak("accent", key);
          }}
        />
        <TweakRadio
          label="Accent name"
          value={t.accent}
          options={["indigo", "navy", "sky"]}
          onChange={(v) => setTweak("accent", v)}
        />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
